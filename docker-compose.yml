services:
  api:
    build: .
    container_name: soundcloud-api
    ports:
      - "${PORT:-7583}:${PORT:-7583}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-7583}
      - TTL_SECONDS=${TTL_SECONDS:-86400}
      - CLEANUP_INTERVAL_MINUTES=${CLEANUP_INTERVAL_MINUTES:-60}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./downloads:/app/downloads
    restart: unless-stopped